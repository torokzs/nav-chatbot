name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Type check
        working-directory: backend
        run: mypy app

      - name: Test
        working-directory: backend
        run: pytest --cov=app --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t nav-chatbot-backend ./backend

      - name: Verify frontend Docker build configuration
        shell: bash
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t nav-chatbot-frontend ./frontend
          elif [ -f frontend/Dockerfile.dev ]; then
            docker build -f frontend/Dockerfile.dev -t nav-chatbot-frontend ./frontend
          else
            echo "No frontend Dockerfile found; production assets were already verified in the frontend job."
          fi

  integration:
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Run integration tests
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: pytest tests/integration/ -v --tb=short

  llm-eval-smoke:
    runs-on: ubuntu-latest
    needs:
      - integration
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install dependencies
        run: pip install -r evals/requirements.txt

      - name: Run smoke LLM evaluation (20 questions)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          AZURE_AI_PROJECT_URL: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'model-router' }}
        working-directory: evals
        run: |
          python run_eval.py 
            --endpoint "$BACKEND_URL" 
            --smoke

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-results
          path: evals/foundry_eval_results.json
          if-no-files-found: warn

  llm-eval-full:
    runs-on: ubuntu-latest
    needs:
      - integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install dependencies
        run: pip install -r evals/requirements.txt

      - name: Run full LLM evaluation (100 questions)
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          AZURE_AI_PROJECT_URL: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'model-router' }}
        working-directory: evals
        run: |
          python run_eval.py 
            --endpoint "$BACKEND_URL"

      - name: Upload full eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-full-results
          path: evals/foundry_eval_results.json
          if-no-files-found: warn
