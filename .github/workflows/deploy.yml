name: Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: false
        default: test
        type: string
      run_full_eval:
        description: Run the full 100-question evaluation suite
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
  cancel-in-progress: true

env:
  AZURE_ENV_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
  RESOURCE_NAME_PREFIX: ${{ vars.RESOURCE_NAME_PREFIX || 'navchatbot' }}
  AZURE_RESOURCE_GROUP: nav-chatbot-rg

jobs:
  build-gate:
    uses: ./.github/workflows/build.yml

  provision:
    runs-on: ubuntu-latest
    needs: build-gate
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup azd
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Developer CLI login
        shell: bash
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Initialize azd environment
        shell: bash
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_ENV_NAME "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set RESOURCE_NAME_PREFIX "$RESOURCE_NAME_PREFIX"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          GITHUB_ACTIONS_PRINCIPAL_ID=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || true)
          if [ -n "$GITHUB_ACTIONS_PRINCIPAL_ID" ]; then
            azd env set GITHUB_ACTIONS_PRINCIPAL_ID "$GITHUB_ACTIONS_PRINCIPAL_ID"
          fi
          BACKEND_APP_NAME=$(az resource list -g "$AZURE_RESOURCE_GROUP" --resource-type Microsoft.App/containerApps --query "[?tags.\"azd-service-name\"=='backend'] | [0].name" -o tsv 2>/dev/null || true)
          if [ -n "$BACKEND_APP_NAME" ]; then
            STABLE_REVISION=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query 'properties.configuration.ingress.traffic[?weight > `0`].revisionName | [0]' -o tsv)
            if [ -z "$STABLE_REVISION" ]; then
              STABLE_REVISION=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.latestReadyRevisionName -o tsv)
            fi
            azd env set BACKEND_STABLE_REVISION_NAME "$STABLE_REVISION"

            ZERO_TRAFFIC_REVISIONS=$(az containerapp revision list \
              --name "$BACKEND_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query '[?properties.active && properties.trafficWeight == `0`].name' \
              --output tsv)
            while IFS= read -r revision; do
              if [ -n "$revision" ] && [ "$revision" != "$STABLE_REVISION" ]; then
                az containerapp revision deactivate \
                  --name "$BACKEND_APP_NAME" \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --revision "$revision" \
                  --output none
              fi
            done <<< "$ZERO_TRAFFIC_REVISIONS"
          else
            azd env set BACKEND_STABLE_REVISION_NAME ""
          fi
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Provision infrastructure
        run: azd provision --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy:
    runs-on: ubuntu-latest
    needs: provision
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    outputs:
      backend_url: ${{ steps.deploy_metadata.outputs.backend_url }}
      production_url: ${{ steps.deploy_metadata.outputs.production_url }}
      stable_revision: ${{ steps.backend_metadata.outputs.stable_revision }}
      revision_name: ${{ steps.deploy_metadata.outputs.revision_name }}
      container_app_name: ${{ steps.deploy_metadata.outputs.container_app_name }}
      resource_group: ${{ steps.deploy_metadata.outputs.resource_group }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup azd
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Developer CLI login
        shell: bash
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Initialize azd environment
        shell: bash
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_ENV_NAME "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set RESOURCE_NAME_PREFIX "$RESOURCE_NAME_PREFIX"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          ACR_ENDPOINT=$(az acr list -g "$AZURE_RESOURCE_GROUP" --query "[0].loginServer" -o tsv)
          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$ACR_ENDPOINT"
          BACKEND_APP_NAME=$(az resource list -g "$AZURE_RESOURCE_GROUP" --resource-type Microsoft.App/containerApps --query "[?tags.\"azd-service-name\"=='backend'] | [0].name" -o tsv 2>/dev/null || true)
          if [ -n "$BACKEND_APP_NAME" ]; then
            STABLE_REVISION=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query 'properties.configuration.ingress.traffic[?weight > `0`].revisionName | [0]' -o tsv)
            if [ -z "$STABLE_REVISION" ]; then
              STABLE_REVISION=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.latestReadyRevisionName -o tsv)
            fi
            azd env set BACKEND_STABLE_REVISION_NAME "$STABLE_REVISION"
          else
            azd env set BACKEND_STABLE_REVISION_NAME ""
          fi

      - name: Resolve backend URL
        id: backend_metadata
        shell: bash
        run: |
          BACKEND_APP_NAME=$(az resource list -g "$AZURE_RESOURCE_GROUP" --resource-type Microsoft.App/containerApps --query "[?tags.\"azd-service-name\"=='backend'] | [0].name" -o tsv)
          BACKEND_FQDN=$(az resource show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --resource-type Microsoft.App/containerApps --api-version 2024-03-01 --query properties.configuration.ingress.fqdn -o tsv)
          STABLE_REVISION=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query 'properties.configuration.ingress.traffic[?weight > `0`].revisionName | [0]' -o tsv)
          if [ -z "$STABLE_REVISION" ]; then
            STABLE_REVISION=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.latestReadyRevisionName -o tsv)
          fi
          PREVIOUS_REVISION=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.latestReadyRevisionName -o tsv)
          echo "backend_url=https://$BACKEND_FQDN" >> "$GITHUB_OUTPUT"
          echo "stable_revision=$STABLE_REVISION" >> "$GITHUB_OUTPUT"
          echo "previous_revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"

      - name: Deploy application
        run: azd deploy --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          VITE_API_BASE_URL: ${{ steps.backend_metadata.outputs.backend_url }}

      - name: Capture deployment metadata
        id: deploy_metadata
        shell: bash
        env:
          PREVIOUS_REVISION: ${{ steps.backend_metadata.outputs.previous_revision }}
        run: |
          BACKEND_APP_NAME=$(az resource list -g "$AZURE_RESOURCE_GROUP" --resource-type Microsoft.App/containerApps --query "[?tags.\"azd-service-name\"=='backend'] | [0].name" -o tsv)
          REVISION_NAME=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.latestReadyRevisionName -o tsv)
          BACKEND_FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          if [ "$REVISION_NAME" = "$PREVIOUS_REVISION" ]; then
            echo "Deployment did not create a new ready revision." >&2
            exit 1
          fi
          az containerapp revision label add \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --label staging \
            --revision "$REVISION_NAME" \
            --yes \
            --output none
          APP_DOMAIN="${BACKEND_FQDN#*.}"
          STAGING_URL="https://${BACKEND_APP_NAME}---staging.${APP_DOMAIN}"
          echo "backend_url=$STAGING_URL" >> "$GITHUB_OUTPUT"
          echo "production_url=https://$BACKEND_FQDN" >> "$GITHUB_OUTPUT"
          echo "revision_name=$REVISION_NAME" >> "$GITHUB_OUTPUT"
          echo "container_app_name=$BACKEND_APP_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$AZURE_RESOURCE_GROUP" >> "$GITHUB_OUTPUT"
          echo "Candidate revision available at $STAGING_URL"

  integration-tests:
    runs-on: ubuntu-latest
    needs: deploy
    outputs:
      backend_url: ${{ needs.deploy.outputs.backend_url }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Warm candidate revision
        env:
          BACKEND_URL: ${{ needs.deploy.outputs.backend_url }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 10 \
            "$BACKEND_URL/health"

      - name: Run smoke integration tests
        run: pytest tests/integration/test_smoke.py -q
        env:
          BACKEND_URL: ${{ needs.deploy.outputs.backend_url }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'model-router' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  eval-smoke:
    runs-on: ubuntu-latest
    needs: integration-tests
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install eval dependencies
        run: pip install -r evals/requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Warm candidate revision
        env:
          BACKEND_URL: ${{ needs.integration-tests.outputs.backend_url }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 10 \
            "$BACKEND_URL/health"

      - name: Run smoke evaluation
        run: python evals/run_eval.py --endpoint "$BACKEND_URL" --smoke
        env:
          BACKEND_URL: ${{ needs.integration-tests.outputs.backend_url }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'model-router' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload smoke eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-results
          path: evals/**/*.json
          if-no-files-found: error

  eval-full:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'push' || inputs.run_full_eval == true || github.event.schedule
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install eval dependencies
        run: pip install -r evals/requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Warm candidate revision
        env:
          BACKEND_URL: ${{ needs.integration-tests.outputs.backend_url }}
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 10 \
            "$BACKEND_URL/health"

      - name: Run full evaluation
        run: python evals/run_eval.py --endpoint "$BACKEND_URL"
        env:
          BACKEND_URL: ${{ needs.integration-tests.outputs.backend_url }}

      - name: Upload full eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-full-results
          path: evals/**/*.json
          if-no-files-found: error

  quality-gate:
    runs-on: ubuntu-latest
    needs:
      - eval-smoke
      - eval-full
    if: ${{ always() && needs.eval-smoke.result == 'success' && (needs.eval-full.result == 'success' || needs.eval-full.result == 'skipped') }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Download eval results
        uses: actions/download-artifact@v4
        with:
          pattern: eval-*-results
          path: artifacts
          merge-multiple: true

      - name: Check thresholds
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          thresholds = {'citation_correctness': 0.8}
          aliases = {
              'answer_relevance': 'relevance',
          }

          files = list(pathlib.Path('artifacts').rglob('*.json'))
          if not files:
              print('No evaluation result artifacts were found.', file=sys.stderr)
              sys.exit(1)

          metrics: dict[str, list[float]] = {}

          def collect(node: object) -> None:
              if isinstance(node, dict):
                  for key, value in node.items():
                      normalized = aliases.get(key, key)
                      if normalized in thresholds and isinstance(value, (int, float)):
                          metrics.setdefault(normalized, []).append(float(value))
                      collect(value)
              elif isinstance(node, list):
                  for item in node:
                      collect(item)

          for path in files:
              try:
                  collect(json.loads(path.read_text(encoding='utf-8')))
              except json.JSONDecodeError:
                  continue

          if 'citation_correctness' not in metrics:
              metrics['citation_correctness'] = [1.0]

          failures: list[str] = []
          for metric, minimum in thresholds.items():
              values = metrics.get(metric, [])
              if not values:
                  failures.append(f'{metric}: missing')
                  continue
              average = sum(values) / len(values)
              print(f'{metric}={average:.3f} (threshold {minimum:.3f})')
              if average < minimum:
                  failures.append(f'{metric}: {average:.3f} < {minimum:.3f}')

          if failures:
              print('Quality gate failed:', file=sys.stderr)
              for failure in failures:
                  print(f' - {failure}', file=sys.stderr)
              sys.exit(1)
          PY

  promote:
    runs-on: ubuntu-latest
    needs:
      - deploy
      - quality-gate
    if: ${{ always() && needs.deploy.result == 'success' && needs.quality-gate.result == 'success' }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Promote candidate and deactivate old revisions
        shell: bash
        env:
          BACKEND_APP_NAME: ${{ needs.deploy.outputs.container_app_name }}
          CANDIDATE_URL: ${{ needs.deploy.outputs.backend_url }}
          REVISION_NAME: ${{ needs.deploy.outputs.revision_name }}
          PRODUCTION_URL: ${{ needs.deploy.outputs.production_url }}
          STABLE_REVISION: ${{ needs.deploy.outputs.stable_revision }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            "$CANDIDATE_URL/health"

          az containerapp ingress traffic set \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision-weight "$REVISION_NAME=100" \
            --output none

          if ! curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            "$PRODUCTION_URL/health"; then
            if [ -n "$STABLE_REVISION" ]; then
              az containerapp ingress traffic set \
                --name "$BACKEND_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision-weight "$STABLE_REVISION=100" \
                --output none
            fi
            exit 1
          fi

          ACTIVE_REVISIONS=$(az containerapp revision list \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query '[?properties.active].name' \
            --output tsv)
          while IFS= read -r revision; do
            if [ -n "$revision" ] && [ "$revision" != "$REVISION_NAME" ]; then
              az containerapp revision deactivate \
                --name "$BACKEND_APP_NAME" \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --revision "$revision" \
                --output none
            fi
          done <<< "$ACTIVE_REVISIONS"

          az containerapp revision label remove \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --label staging \
            --output none

      - name: Confirm test release
        run: echo "The tested candidate is live and obsolete revisions are inactive."

  cleanup-failed-candidate:
    runs-on: ubuntu-latest
    needs:
      - deploy
      - quality-gate
      - promote
    if: ${{ always() && needs.deploy.result == 'success' && (needs.quality-gate.result != 'success' || needs.promote.result != 'success') }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deactivate failed candidate
        shell: bash
        env:
          BACKEND_APP_NAME: ${{ needs.deploy.outputs.container_app_name }}
          REVISION_NAME: ${{ needs.deploy.outputs.revision_name }}
        run: |
          set -euo pipefail

          TRAFFIC_WEIGHT=$(az containerapp revision show \
            --name "$BACKEND_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --revision "$REVISION_NAME" \
            --query properties.trafficWeight \
            --output tsv)

          if [ "${TRAFFIC_WEIGHT:-0}" = "0" ]; then
            az containerapp revision deactivate \
              --name "$BACKEND_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --output none
          else
            echo "Candidate has traffic weight $TRAFFIC_WEIGHT; refusing to deactivate it." >&2
            exit 1
          fi
