name: Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: false
        default: test
        type: string
      run_full_eval:
        description: Run the full 100-question evaluation suite
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
  cancel-in-progress: true

env:
  AZURE_ENV_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
  RESOURCE_NAME_PREFIX: ${{ vars.RESOURCE_NAME_PREFIX || 'navchatbot' }}
  AZURE_RESOURCE_GROUP: nav-chatbot-rg

jobs:
  build-gate:
    uses: ./.github/workflows/build.yml

  provision:
    runs-on: ubuntu-latest
    needs: build-gate
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup azd
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize azd environment
        shell: bash
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_ENV_NAME "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set RESOURCE_NAME_PREFIX "$RESOURCE_NAME_PREFIX"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          GITHUB_ACTIONS_PRINCIPAL_ID=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null || true)
          if [ -n "$GITHUB_ACTIONS_PRINCIPAL_ID" ]; then
            azd env set GITHUB_ACTIONS_PRINCIPAL_ID "$GITHUB_ACTIONS_PRINCIPAL_ID"
          fi
          BACKEND_APP_NAME=$(az resource list -g "$AZURE_RESOURCE_GROUP" --tag azd-service-name=backend --resource-type Microsoft.App/containerApps --query "[0].name" -o tsv 2>/dev/null || true)
          if [ -n "$BACKEND_APP_NAME" ]; then
            STABLE_REVISION=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.latestReadyRevisionName -o tsv)
            azd env set BACKEND_STABLE_REVISION_NAME "$STABLE_REVISION"
          fi
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Provision infrastructure
        run: azd provision --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy:
    runs-on: ubuntu-latest
    needs: provision
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    outputs:
      backend_url: ${{ steps.deploy_metadata.outputs.backend_url }}
      revision_name: ${{ steps.deploy_metadata.outputs.revision_name }}
      container_app_name: ${{ steps.deploy_metadata.outputs.container_app_name }}
      resource_group: ${{ steps.deploy_metadata.outputs.resource_group }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup azd
        uses: Azure/setup-azd@v2

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize azd environment
        shell: bash
        run: |
          azd env new "$AZURE_ENV_NAME" --no-prompt || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_ENV_NAME "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set RESOURCE_NAME_PREFIX "$RESOURCE_NAME_PREFIX"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"
          BACKEND_APP_NAME=$(az resource list -g "$AZURE_RESOURCE_GROUP" --tag azd-service-name=backend --resource-type Microsoft.App/containerApps --query "[0].name" -o tsv 2>/dev/null || true)
          if [ -n "$BACKEND_APP_NAME" ]; then
            STABLE_REVISION=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.latestReadyRevisionName -o tsv)
            azd env set BACKEND_STABLE_REVISION_NAME "$STABLE_REVISION"
          fi

      - name: Deploy application
        run: azd deploy --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture deployment metadata
        id: deploy_metadata
        shell: bash
        run: |
          BACKEND_APP_NAME=$(az resource list -g "$AZURE_RESOURCE_GROUP" --tag azd-service-name=backend --resource-type Microsoft.App/containerApps --query "[0].name" -o tsv)
          REVISION_NAME=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.latestReadyRevisionName -o tsv)
          BACKEND_FQDN=$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$BACKEND_APP_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          echo "backend_url=https://$BACKEND_FQDN" >> "$GITHUB_OUTPUT"
          echo "revision_name=$REVISION_NAME" >> "$GITHUB_OUTPUT"
          echo "container_app_name=$BACKEND_APP_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$AZURE_RESOURCE_GROUP" >> "$GITHUB_OUTPUT"
          echo "New revision available at https://$BACKEND_FQDN"

  integration-tests:
    runs-on: ubuntu-latest
    needs: deploy
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt

      - name: Run smoke integration tests
        run: pytest tests/integration/test_smoke.py -q
        env:
          BACKEND_URL: ${{ needs.deploy.outputs.backend_url }}

  eval-smoke:
    runs-on: ubuntu-latest
    needs: integration-tests
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install eval dependencies
        run: pip install -r evals/requirements.txt

      - name: Run smoke evaluation
        run: python evals/run_eval.py --endpoint "$BACKEND_URL" --smoke
        env:
          BACKEND_URL: ${{ needs.deploy.outputs.backend_url }}

      - name: Upload smoke eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-results
          path: evals/**/*.json
          if-no-files-found: error

  eval-full:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'push' || inputs.run_full_eval == true || github.event.schedule
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install eval dependencies
        run: pip install -r evals/requirements.txt

      - name: Run full evaluation
        run: python evals/run_eval.py --endpoint "$BACKEND_URL"
        env:
          BACKEND_URL: ${{ needs.deploy.outputs.backend_url }}

      - name: Upload full eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-full-results
          path: evals/**/*.json
          if-no-files-found: error

  quality-gate:
    runs-on: ubuntu-latest
    needs:
      - eval-smoke
      - eval-full
    if: ${{ always() && needs.eval-smoke.result == 'success' && (needs.eval-full.result == 'success' || needs.eval-full.result == 'skipped') }}
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.AZURE_ENV_NAME || 'test' }}
    steps:
      - name: Download eval results
        uses: actions/download-artifact@v4
        with:
          pattern: eval-*-results
          path: artifacts
          merge-multiple: true

      - name: Check thresholds
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          thresholds = {
              'groundedness': 4.0,
              'relevance': 4.0,
              'citation_correctness': 0.8,
          }
          aliases = {
              'answer_relevance': 'relevance',
          }

          files = list(pathlib.Path('artifacts').rglob('*.json'))
          if not files:
              print('No evaluation result artifacts were found.', file=sys.stderr)
              sys.exit(1)

          metrics: dict[str, list[float]] = {}

          def collect(node: object) -> None:
              if isinstance(node, dict):
                  for key, value in node.items():
                      normalized = aliases.get(key, key)
                      if normalized in thresholds and isinstance(value, (int, float)):
                          metrics.setdefault(normalized, []).append(float(value))
                      collect(value)
              elif isinstance(node, list):
                  for item in node:
                      collect(item)

          for path in files:
              try:
                  collect(json.loads(path.read_text(encoding='utf-8')))
              except json.JSONDecodeError:
                  continue

          failures: list[str] = []
          for metric, minimum in thresholds.items():
              values = metrics.get(metric, [])
              if not values:
                  failures.append(f'{metric}: missing')
                  continue
              average = sum(values) / len(values)
              print(f'{metric}={average:.3f} (threshold {minimum:.3f})')
              if average < minimum:
                  failures.append(f'{metric}: {average:.3f} < {minimum:.3f}')

          if failures:
              print('Quality gate failed:', file=sys.stderr)
              for failure in failures:
                  print(f' - {failure}', file=sys.stderr)
              sys.exit(1)
          PY

  test-release-ready:
    runs-on: ubuntu-latest
    needs:
      - deploy
      - quality-gate
    if: ${{ always() && needs.deploy.result == 'success' && needs.quality-gate.result == 'success' }}
    steps:
      - name: Confirm test release
        run: echo "The pull request revision passed the complete test deployment quality gate."
