name: Deploy

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      run_full_eval:
        description: Run the full 100-question evaluation suite
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

env:
  AZURE_ENV_NAME: test
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'swedencentral' }}
  RESOURCE_NAME_PREFIX: ${{ vars.RESOURCE_NAME_PREFIX || 'navchatbot' }}
  AZURE_RESOURCE_GROUP: nav-chatbot-rg

jobs:
  build-gate:
    uses: ./.github/workflows/build.yml

  deploy-test:
    runs-on: ubuntu-latest
    needs: build-gate
    environment:
      name: test
      url: ${{ steps.deployment_metadata.outputs.application_url }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup azd
        uses: Azure/setup-azd@v2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            tests/integration/requirements.txt
            evals/requirements.txt

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Developer CLI login
        shell: bash
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Initialize test environment
        id: initialize
        shell: bash
        run: |
          set -euo pipefail

          azd env new "$AZURE_ENV_NAME" --no-prompt 2>/dev/null || azd env select "$AZURE_ENV_NAME"
          azd env set AZURE_ENV_NAME "$AZURE_ENV_NAME"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set RESOURCE_NAME_PREFIX "$RESOURCE_NAME_PREFIX"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"

          if principal_id=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv 2>/dev/null); then
            azd env set GITHUB_ACTIONS_PRINCIPAL_ID "$principal_id"
          else
            echo "::warning::The workflow principal object ID could not be resolved; optional deployment RBAC will be skipped."
            azd env set GITHUB_ACTIONS_PRINCIPAL_ID ""
          fi

          backend_app_name=$(az resource list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.App/containerApps \
            --query "[?tags.\"azd-env-name\"=='$AZURE_ENV_NAME' && tags.\"azd-service-name\"=='backend'] | [0].name" \
            --output tsv)

          if [ -n "$backend_app_name" ]; then
            stable_revision=$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$backend_app_name" \
              --query "properties.configuration.ingress.traffic[?weight == \`100\`] | [0].revisionName" \
              --output tsv)
            if [ -z "$stable_revision" ]; then
              stable_revision=$(az containerapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$backend_app_name" \
                --query properties.latestReadyRevisionName \
                --output tsv)
            fi
            azd env set BACKEND_STABLE_REVISION_NAME "$stable_revision"
          else
            stable_revision=""
            azd env set BACKEND_STABLE_REVISION_NAME ""
          fi
          echo "stable_revision=$stable_revision" >> "$GITHUB_OUTPUT"
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Provision infrastructure
        run: azd provision --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve test resources
        id: resources
        shell: bash
        run: |
          set -euo pipefail

          backend_app_name=$(az resource list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.App/containerApps \
            --query "[?tags.\"azd-env-name\"=='$AZURE_ENV_NAME' && tags.\"azd-service-name\"=='backend'] | [0].name" \
            --output tsv)
          acr_endpoint=$(az acr list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?tags.\"azd-env-name\"=='$AZURE_ENV_NAME'] | [0].loginServer" \
            --output tsv)

          if [ -z "$backend_app_name" ] || [ -z "$acr_endpoint" ]; then
            echo "::error::Provisioning did not produce the test Container App and registry."
            exit 1
          fi

          application_fqdn=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$backend_app_name" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$acr_endpoint"
          echo "backend_app_name=$backend_app_name" >> "$GITHUB_OUTPUT"
          echo "acr_endpoint=$acr_endpoint" >> "$GITHUB_OUTPUT"
          echo "application_url=https://$application_fqdn" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        run: azd deploy frontend --no-prompt
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          VITE_API_BASE_URL: ${{ steps.resources.outputs.application_url }}

      - name: Build backend image
        id: backend_image
        shell: bash
        run: |
          set -euo pipefail

          acr_endpoint="${{ steps.resources.outputs.acr_endpoint }}"
          acr_name="${acr_endpoint%%.*}"
          image_repository="nav-chatbot/backend-test"
          image_tag="gh-${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}"

          az acr build \
            --registry "$acr_name" \
            --image "$image_repository:$image_tag" \
            backend

          echo "image=$acr_endpoint/$image_repository:$image_tag" >> "$GITHUB_OUTPUT"

      - name: Create isolated backend revision
        id: backend_deploy
        shell: bash
        run: |
          set -euo pipefail

          backend_app_name="${{ steps.resources.outputs.backend_app_name }}"
          stable_revision="${{ steps.initialize.outputs.stable_revision }}"
          revision_suffix="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if [ -z "$stable_revision" ]; then
            echo "::error::A stable backend revision is required for an isolated deployment."
            exit 1
          fi

          az containerapp revision copy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$backend_app_name" \
            --from-revision "$stable_revision" \
            --image "${{ steps.backend_image.outputs.image }}" \
            --set-env-vars AZURE_AI_FOUNDRY_CHAT_DEPLOYMENT=model-router \
            --revision-suffix "$revision_suffix" \
            --output none

          echo "revision_name=$backend_app_name--$revision_suffix" >> "$GITHUB_OUTPUT"

      - name: Wait for deployed revision
        id: deployment_metadata
        shell: bash
        run: |
          set -euo pipefail

          backend_app_name="${{ steps.resources.outputs.backend_app_name }}"
          revision_name="${{ steps.backend_deploy.outputs.revision_name }}"

          for attempt in {1..30}; do
            running_state=$(az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$backend_app_name" \
              --revision "$revision_name" \
              --query properties.runningState \
              --output tsv)
            if [ "$running_state" = "Running" ]; then
              break
            fi
            if [ "$running_state" = "Failed" ] || [ "$running_state" = "Degraded" ]; then
              echo "::error::Revision $revision_name entered state $running_state."
              exit 1
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Revision $revision_name did not become ready within five minutes."
              exit 1
            fi
            sleep 10
          done

          revision_fqdn=$(az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$backend_app_name" \
            --revision "$revision_name" \
            --query properties.fqdn \
            --output tsv)
          if [ -z "$revision_fqdn" ]; then
            echo "::error::The deployed revision has no reachable FQDN."
            exit 1
          fi

          echo "revision_name=$revision_name" >> "$GITHUB_OUTPUT"
          echo "revision_url=https://$revision_fqdn" >> "$GITHUB_OUTPUT"
          echo "application_url=${{ steps.resources.outputs.application_url }}" >> "$GITHUB_OUTPUT"

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 10 "$BACKEND_URL/health"; then
              exit 0
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "::error::The deployed revision health endpoint did not become ready within three minutes."
              exit 1
            fi
            sleep 10
          done
        env:
          BACKEND_URL: ${{ steps.deployment_metadata.outputs.revision_url }}

      - name: Install test dependencies
        run: pip install -r tests/integration/requirements.txt -r evals/requirements.txt

      - name: Run integration tests
        run: pytest tests/integration/test_smoke.py -q
        env:
          BACKEND_URL: ${{ steps.deployment_metadata.outputs.revision_url }}

      - name: Run five-question smoke evaluation
        id: smoke_evaluation
        run: python evals/run_eval.py --endpoint "$BACKEND_URL" --smoke
        env:
          BACKEND_URL: ${{ steps.deployment_metadata.outputs.revision_url }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'model-router' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload smoke evaluation results
        if: always() && steps.smoke_evaluation.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-results
          path: evals/foundry_eval_results.json
          if-no-files-found: error

      - name: Run full evaluation
        if: inputs.run_full_eval == true
        run: python evals/run_eval.py --endpoint "$BACKEND_URL"
        env:
          BACKEND_URL: ${{ steps.deployment_metadata.outputs.revision_url }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'model-router' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload full evaluation results
        if: always() && inputs.run_full_eval == true
        uses: actions/upload-artifact@v4
        with:
          name: eval-full-results
          path: evals/foundry_eval_results.json
          if-no-files-found: error

      - name: Promote tested revision
        shell: bash
        run: |
          set -euo pipefail
          backend_app_name="${{ steps.resources.outputs.backend_app_name }}"
          revision_name="${{ steps.deployment_metadata.outputs.revision_name }}"
          previous_revision="${{ steps.initialize.outputs.stable_revision }}"

          az containerapp ingress traffic set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$backend_app_name" \
            --revision-weight "$revision_name=100"

          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "${{ steps.resources.outputs.application_url }}/health"; then
              echo "Promoted $revision_name to 100% traffic."
              exit 0
            fi
            sleep 10
          done

          if [ -n "$previous_revision" ]; then
            echo "::warning::The promoted application did not become healthy; restoring $previous_revision."
            az containerapp ingress traffic set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$backend_app_name" \
              --revision-weight "$previous_revision=100"
          fi
          echo "::error::The promoted application health check failed."
          exit 1

      - name: Deactivate failed revision
        if: failure() && steps.backend_deploy.outcome == 'success'
        run: >-
          az containerapp revision deactivate
          --resource-group "$AZURE_RESOURCE_GROUP"
          --name "${{ steps.resources.outputs.backend_app_name }}"
          --revision "${{ steps.backend_deploy.outputs.revision_name }}"
